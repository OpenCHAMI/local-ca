# /usr/share/containers/systemd/step-ca.container.d/10-defaults.conf
#
# =============================================================================
# step-ca - Default Quadlet Drop-In
# =============================================================================
#
# Package-supplied defaults for the step-ca container.  Do not edit this file;
# it is replaced on upgrade.  Override any key by dropping a higher-numbered
# file (e.g. 20-site.conf) into /etc/containers/systemd/step-ca.container.d/,
# either by hand or via one of the OpenCHAMI deployment meta-configuration
# packages.
#
# The CA has no configuration file: step-ca is configured by the
# DOCKER_STEPCA_INIT_* variables below, which the image entrypoint reads on
# first start only.

[Container]

# -------------------------------------------------------------------------
# Volumes
# -------------------------------------------------------------------------

# CA home: ca.json, the signing keys, and the password file.  Losing this
# volume discards the CA identity and the next start mints a new root.
Volume=step-ca-home.volume:/home/step

# Badger database of issued certificates.  Kept separate from the CA home so
# it can be sized and backed up independently.
Volume=step-ca-db.volume:/home/step/db

# Root and intermediate certificates, published by the entrypoint for other
# services to consume.  openchami-cert-trust.service reads the root from here.
Volume=step-root-ca.volume:/root_ca/

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
# The CA is only ever reached by the ACME client, so it stays off the service
# networks entirely.

Network=openchami-cert-internal.network

# All traffic is host-local; keep the host's proxy settings out of the way.
PodmanArgs=--http-proxy=false

# The CA resolves its peers on the container network; /etc/hosts entries for
# the container name would shadow them.
PodmanArgs=--no-hosts

# -------------------------------------------------------------------------
# CA Initialization
# -------------------------------------------------------------------------
# Read by the image entrypoint, and only when /home/step/config/ca.json is
# absent.  Changing any of them afterwards has no effect unless the CA home
# volume is discarded, which mints a new root certificate and invalidates
# every certificate already issued.

# Root of the step configuration tree inside the container.
Environment=STEPPATH=/home/step

# Common name of the generated root certificate.
Environment=DOCKER_STEPCA_INIT_NAME=OpenCHAMI

# SANs the CA answers to.  Must include the name the ACME client dials.
Environment=DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,step-ca.openchami.cluster

# Enable the ACME provisioner, which is how certificates are requested.
Environment=DOCKER_STEPCA_INIT_ACME=true

# Name of the provisioner created at init.
Environment=DOCKER_STEPCA_INIT_PROVISIONER_NAME=Admin

# Password protecting the CA signing keys, supplied as a mounted podman
# secret rather than an environment value.  The named secret must exist
# beforehand: it is created either explicitly by the site administrator
# (podman secret create) or implicitly by one of the OpenCHAMI deployment
# meta-configuration packages.  When the secret is absent the entrypoint
# generates a random password and prints it once to the journal.
Secret=step_ca_init_password,type=mount
Environment=DOCKER_STEPCA_INIT_PASSWORD_FILE=/run/secrets/step_ca_init_password

# =============================================================================
# End of defaults.
# =============================================================================
