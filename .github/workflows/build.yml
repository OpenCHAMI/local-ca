name: build
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # container.yml pushes to GHCR
  id-token: write      # Sigstore signing (built-in provenance)
  attestations: write  # built-in provenance & SBOM

jobs:
  container:
    uses: ./.github/workflows/container.yml

  config:
    needs: container
    runs-on: ubuntu-latest
    outputs:
      rpm-unsigned: ${{ steps.names.outputs.rpm-unsigned }}
      rpm-signed:   ${{ steps.names.outputs.rpm-signed }}
      keys-public:  ${{ steps.names.outputs.keys-public }}
    steps:
      - id: names
        run: |
          {
            echo "rpm-unsigned=rpms-unsigned"
            echo "rpm-signed=rpms-signed"
            echo "keys-public=gpg-public-keys"
          } >> "$GITHUB_OUTPUT"

  rpmbuild:
    needs: [config]
    uses: OpenCHAMI/github-actions/.github/workflows/build-rpm-quadlet.yml@0874861a34e9835641ae96fea2904643cc727824 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}

  rpmsign:
    needs: [config, rpmbuild]
    uses: OpenCHAMI/github-actions/.github/workflows/gpg-sign-artifacts.yml@0874861a34e9835641ae96fea2904643cc727824 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-unsigned-rpms: ${{ needs.config.outputs.rpm-unsigned }}
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      artifact-name-public-keys:   ${{ needs.config.outputs.keys-public }}

  rpmvalidate:
    needs: [config, rpmsign]
    uses: OpenCHAMI/github-actions/.github/workflows/validate-rpm-quadlet.yml@0874861a34e9835641ae96fea2904643cc727824 # seantronsen/feat/add-missing-workflows
    secrets: inherit
    with:
      artifact-name-signed-rpms:   ${{ needs.config.outputs.rpm-signed }}
      rpms: |
        - name: local-ca-quadlet-*.rpm
          files:
            - /usr/share/containers/systemd/step-ca-db.volume
            - /usr/share/containers/systemd/step-ca-home.volume
            - /usr/share/containers/systemd/step-ca.container
            - /usr/share/containers/systemd/step-ca.container.d
            - /usr/share/containers/systemd/step-ca.container.d/10-defaults.conf
            - /usr/share/containers/systemd/step-root-ca.volume
            - /usr/share/licenses/local-ca-quadlet
            - /usr/share/licenses/local-ca-quadlet/MIT.txt
