name: container

# Reusable workflow that builds the local-ca image and pushes it to GHCR.
# Tags come from the calling event: pr-<N> on a pull request, the tag name
# on a tag push, the branch name otherwise.

on:
  workflow_call:

permissions:
  contents: read       # checkout
  packages: write      # push the image to GHCR
  id-token: write      # Sigstore signing (built-in provenance)
  attestations: write  # built-in provenance & SBOM

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: check out the repo
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/openchami/local-ca
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha

      - name: Login to github container repo
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: |
            linux/amd64
            linux/arm64/v8
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Built-in attestations work better with multi-arch than the
          # separate attest action
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/openchami/local-ca:${VERSION}"
